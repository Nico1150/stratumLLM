[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stratumllm"
version = "0.1.0"
description = "Dynamic deployment strategy manager for local LLMs (VRAM vs system RAM)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "psutil>=5.9",
]

[project.optional-dependencies]
nvidia = ["pynvml>=11.5"]
dev = ["pytest>=7.4", "mypy>=1.8", "ruff>=0.1"]

[tool.hatch.build.targets.wheel]
packages = ["stratumllm"]

[tool.hatch.build.targets.wheel.force-include]
"src/stratumllm" = "stratumllm"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py310"
